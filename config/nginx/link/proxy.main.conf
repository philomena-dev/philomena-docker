# Selected on a proxy server. Accepts the connections the app server's
# scraper makes and hands them to tinyproxy. Only a client holding a
# certificate signed by the private authority gets through.

stream {
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 3129 ssl;

    ssl_certificate /etc/philomena-certs/internal/edge.pem;
    ssl_certificate_key /etc/philomena-certs/internal/edge-key.pem;
    ssl_client_certificate /etc/philomena-certs/internal/ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 1;
    ssl_protocols TLSv1.3;

    set $scraper_proxy tinyproxy:3128;
    proxy_pass $scraper_proxy;
  }
}

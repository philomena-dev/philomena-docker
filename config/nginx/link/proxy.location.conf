# Selected on a proxy server. Requests relayed to the app server present the
# link certificate, and the app server has to present one signed by the same
# private authority.

proxy_ssl_certificate /etc/philomena-certs/internal/edge.pem;
proxy_ssl_certificate_key /etc/philomena-certs/internal/edge-key.pem;
proxy_ssl_trusted_certificate /etc/philomena-certs/internal/ca.pem;
proxy_ssl_verify on;
proxy_ssl_verify_depth 1;
proxy_ssl_name origin.internal;
proxy_ssl_server_name on;
proxy_ssl_protocols TLSv1.3;
proxy_ssl_session_reuse on;

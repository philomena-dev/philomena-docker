# Selected with CDN_SOURCE=storage in .env (the default).
#
# Uploaded files are fetched from object storage by this server, with a
# signed request, and kept in the local cache. The application is not
# involved in serving them.

set $content_disposition '';

location ~ ^/img/download/(.+)/([0-9]+).*\.([A-Za-z0-9]+)$ {
  set $content_disposition attachment;
  rewrite ^/img/download/(.+)/([0-9]+).*\.([A-Za-z0-9]+)$ /_storage/images/$1/$2/full.$3 last;
}

location ~ ^/img/view/(.+)/([0-9]+).*\.([A-Za-z0-9]+)$ {
  rewrite ^/img/view/(.+)/([0-9]+).*\.([A-Za-z0-9]+)$ /_storage/images/$1/$2/full.$3 last;
}

location ~ ^/img/(.+)$ {
  rewrite ^/img/(.+)$ /_storage/images/$1 last;
}

location ~ ^/spns/(.+)$ {
  rewrite ^/spns/(.+)$ /_storage/adverts/$1 last;
}

location ~ ^/avatars/(.+)$ {
  rewrite ^/avatars/(.+)$ /_storage/avatars/$1 last;
}

location ~ ^/badges/(.+)$ {
  rewrite ^/badges/(.+)$ /_storage/badges/$1 last;
}

location ~ ^/tags/(.+)$ {
  rewrite ^/tags/(.+)$ /_storage/tags/$1 last;
}

location /_storage/ {
  internal;

  # Filled in by sign_request: the address of the storage service, and the
  # path of the file in its bucket.
  set $s3_upstream '';
  set $s3_host '';
  set $s3_name '';
  set $s3_path '';

  access_by_lua_block { require('s3').sign_request('/_storage/') }
  header_filter_by_lua_block { require('s3').response_headers() }

  proxy_pass $s3_upstream$s3_path;
  proxy_set_header Host $s3_host;
  proxy_set_header Connection '';
  proxy_ssl_server_name on;
  proxy_ssl_name $s3_name;
  proxy_ssl_verify on;
  proxy_ssl_verify_depth 4;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

  proxy_cache cdn;
  proxy_cache_key $s3_path;
  proxy_cache_valid 200 6h;
  proxy_cache_valid 404 1m;
  proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
  proxy_cache_background_update on;
  proxy_cache_lock on;

  # Partial requests are answered from the cached file, whether or not the
  # storage service advertises support for them.
  proxy_force_ranges on;

  # Storage services describe errors in XML, which is of no use to visitors.
  proxy_intercept_errors on;
  error_page 403 404 =404 @storage_not_found;
}

location @storage_not_found {
  internal;
  default_type text/plain;
  return 404 'Not found';
}

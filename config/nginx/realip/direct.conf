# Selected with CLIENT_IP_SOURCE=direct in .env (the default).
#
# Visitors connect to this server directly, so the address of the connection
# is the address of the visitor. Nothing to configure.
#
# To put the site behind another proxy or load balancer, copy this file to
# custom.conf, list the addresses of that proxy with `set_real_ip_from` and
# name the header it sends with `real_ip_header`, then set
# CLIENT_IP_SOURCE=custom.

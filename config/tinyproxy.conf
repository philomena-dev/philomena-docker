# Outgoing proxy for the scraper, which fetches the URLs users submit.

Port 3128
LogLevel Error
MaxClients 32
DisableViaHeader yes

# Only reachable from other containers, and through the server link.
Allow 0.0.0.0/0
Allow ::/0

ConnectPort 443
ConnectPort 8443

# Addresses that are never fetched on behalf of a user.
Filter "/tinyproxy-filter"
FilterType ere
FilterURLs Off
FilterDefaultDeny No

# The only request headers that are passed on.
Anonymous "Host"
Anonymous "Authorization"
Anonymous "Cookie"
Anonymous "User-Agent"
Anonymous "Content-Type"
Anonymous "Accept-Encoding"
Anonymous "Range"
Anonymous "Cache-Control"
Anonymous "Content-Length"
Anonymous "Accept-Charset"

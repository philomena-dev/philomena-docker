# The Philomena application and everything it needs to run.
#
# Settings are read from .env, which `./philomena.sh prepare` generates from
# templates/app.env. Nothing in this file publishes a port: the public-facing
# services live in docker-compose.edge.yml (single server) or are reached
# through docker-compose.link-app.yml (separate proxy server).

name: philomena

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 50m
      max-file: '5'

x-philomena: &philomena
  <<: *defaults
  image: ghcr.io/philomena-dev/philomena:${PHILOMENA_VERSION:-1.3.0-rc1}
  working_dir: /srv/philomena
  # Secrets, mail, API keys and object storage settings come straight from
  # .env. Everything below is wiring that is the same for every deployment.
  env_file: .env
  environment: &philomena-environment
    DATABASE_URL: ecto://philomena:${POSTGRES_PASSWORD}@postgres/philomena
    PGHOST: postgres
    PGUSER: philomena
    PGPASSWORD: ${POSTGRES_PASSWORD}
    PGDATABASE: philomena
    REDIS_HOST: valkey
    OPENSEARCH_URL: http://opensearch:9200
    MEDIAPROC_ADDR: mediaproc:1500
    PROXY_HOST: ${PROXY_HOST:-http://tinyproxy:3128}
    APP_IP: 0.0.0.0
    PORT: 4000
    APP_ORIGIN: https://${SITE_DOMAIN}
    SITE_DOMAINS: ${SITE_DOMAINS:-${SITE_DOMAIN}}
    CDN_HOST: ${CDN_DOMAIN}
    CAMO_HOST: ${EXT_DOMAIN}
    IMAGE_URL_ROOT: https://${CDN_DOMAIN}/img
    AVATAR_URL_ROOT: https://${CDN_DOMAIN}/avatars
    ADVERT_URL_ROOT: https://${CDN_DOMAIN}/spns
    BADGE_URL_ROOT: https://${CDN_DOMAIN}/badges
    TAG_URL_ROOT: https://${CDN_DOMAIN}/tags
    IMAGE_FILE_ROOT: images
    AVATAR_FILE_ROOT: avatars
    ADVERT_FILE_ROOT: adverts
    BADGE_FILE_ROOT: badges
    TAG_FILE_ROOT: tags
  networks:
    - default
    - backend
  depends_on:
    postgres:
      condition: service_healthy
    opensearch:
      condition: service_healthy
    valkey:
      condition: service_healthy
    mediaproc:
      condition: service_started

services:
  app:
    <<: *philomena
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:4000/robots.txt']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 2m

  worker:
    <<: *philomena
    environment:
      <<: *philomena-environment
      START_WORKER: 'true'
    stop_grace_period: 1m

  # Runs the periodic jobs: `run-cron` every five minutes and `run-cron-daily`
  # once a day at CRON_DAILY_HOUR (UTC).
  scheduler:
    <<: *philomena
    command: ['/bin/sh', '/opt/philomena-docker/scheduler.sh']
    environment:
      <<: *philomena-environment
      CRON_DAILY_HOUR: ${CRON_DAILY_HOUR:-8}
    volumes:
      - ./scripts/container:/opt/philomena-docker:ro
    stop_grace_period: 1m

  postgres:
    <<: *defaults
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: philomena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set, run ./philomena.sh prepare}
      POSTGRES_DB: philomena
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-256}
    # The image keeps each major version in its own subdirectory, so the data
    # of PostgreSQL 18 ends up in ./volumes/postgres/18.
    volumes:
      - ./volumes/postgres:/var/lib/postgresql
    shm_size: 256m
    stop_grace_period: 2m
    healthcheck:
      test: ['CMD', 'pg_isready', '-q', '-U', 'philomena', '-d', 'philomena']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 1m
    networks:
      - backend

  # Writes a database dump to ./backups once a day at BACKUP_HOUR (UTC) and
  # removes dumps older than BACKUP_KEEP_DAYS.
  backup:
    <<: *defaults
    image: postgres:18.6-alpine
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    entrypoint: ['/bin/sh', '/opt/philomena-docker/backup.sh']
    command: ['schedule']
    environment:
      PGHOST: postgres
      PGUSER: philomena
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: philomena
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/container:/opt/philomena-docker:ro
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  opensearch:
    <<: *defaults
    image: opensearchproject/opensearch:3.9.0
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms${OPENSEARCH_HEAP:-4g} -Xmx${OPENSEARCH_HEAP:-4g}
    volumes:
      - ./volumes/opensearch:/usr/share/opensearch/data
      - ./config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      memlock:
        soft: -1
        hard: -1
    stop_grace_period: 2m
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 2m
    networks:
      - backend

  # Holds the job queues. Persisted so that queued work survives a restart.
  valkey:
    <<: *defaults
    image: valkey/valkey:9.1.2-alpine
    command: ['valkey-server', '--appendonly', 'yes']
    volumes:
      - ./volumes/valkey:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - backend

  mediaproc:
    <<: *defaults
    image: ghcr.io/philomena-dev/mediaproc:${PHILOMENA_VERSION:-1.3.0-rc1}
    environment:
      RUST_LOG: ${MEDIAPROC_LOG:-info}
    deploy:
      resources:
        limits:
          cpus: ${MEDIAPROC_CPUS:-4}
          memory: ${MEDIAPROC_MEMORY:-8gb}
          pids: 8192
    networks:
      - backend

  # Serves static assets and the files in object storage, and passes every
  # other request on to the application.
  caddy:
    <<: *defaults
    image: ghcr.io/philomena-dev/philomena-web:${PHILOMENA_VERSION:-1.3.0-rc1}
    entrypoint: ['/bin/sh', '/opt/philomena-docker/caddy-entrypoint.sh']
    environment:
      APP_URL: http://${SITE_DOMAIN}
      CDN_URL: http://${CDN_DOMAIN}
      SITE_DOMAIN: ${SITE_DOMAIN}
      APP_ADDRESS: app:4000
      DOWNTIME: ${DOWNTIME:-false}
      S3_ENDPOINT: ${S3_SCHEME}://${S3_HOST}:${S3_PORT}
      S3_BUCKET: ${S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${WEB_AWS_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID}}
      AWS_SECRET_ACCESS_KEY: ${WEB_AWS_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY}}
    volumes:
      - ./config/caddy/entrypoint.sh:/opt/philomena-docker/caddy-entrypoint.sh:ro
      - ./volumes/caddy:/data
      - ./logs/caddy:/var/log/caddy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - default
      - backend

  # Stores uploaded files on this server instead of an external object
  # storage service. Enabled by COMPOSE_PROFILES=local-storage in .env.
  files:
    <<: *defaults
    image: andrewgaul/s3proxy:4.1.1
    environment:
      JCLOUDS_FILESYSTEM_BASEDIR: /data
      S3PROXY_IGNORE_UNKNOWN_HEADERS: 'true'
      S3PROXY_IDENTITY: ${AWS_ACCESS_KEY_ID}
      S3PROXY_CREDENTIAL: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./volumes/files:/data
    # Also attached to the default network so that the public-facing web
    # server can read from it on a single server.
    networks:
      - default
      - backend
    profiles:
      - local-storage

networks:
  # Databases and internal services. Containers that are only attached to
  # this network cannot reach the internet, and the services that fetch
  # remote content on behalf of users (docker-compose.edge.yml) are not
  # attached to it at all.
  backend:
    internal: true

# App server end of the link between the two servers of a deployment.
# Loaded together with docker-compose.yml.
#
# The only published port accepts connections from the proxy server, which
# has to present a certificate signed by the private authority in
# certs/internal. Nothing else on this server is reachable from outside.

name: philomena

services:
  link:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'
    image: philomena-docker-caddy
    build: ./images/caddy
    command: ['caddy', 'run', '--config', '/etc/philomena/link.Caddyfile', '--adapter', 'caddyfile']
    environment:
      PROXY_SERVER: ${PROXY_SERVER:?PROXY_SERVER is not set, run ./philomena.sh prepare}
      SCRAPER_LINK_PORT: ${SCRAPER_LINK_PORT:-3129}
    volumes:
      - ./config/caddy:/etc/philomena:ro
      - ./certs/internal:/etc/philomena-certs/internal:ro
    # Published on every address of this server, or only on ORIGIN_BIND when
    # that is set (the WireGuard tunnel, see `./philomena.sh wireguard`).
    ports:
      - '${ORIGIN_BIND:-}${ORIGIN_BIND:+:}${ORIGIN_PORT:-8443}:8443'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 5s
      retries: 6
